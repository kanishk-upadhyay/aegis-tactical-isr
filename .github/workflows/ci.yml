name: AEGIS-TACTICAL-ISR CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    name: Unit Tests & Georeferencing Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --durations=10

      - name: Execute Standalone Simulation Smoke Test
        run: |
          python scripts/demo_simulation.py --frames 20 --quiet

      - name: Run Quantitative Mission Benchmark Suite
        run: |
          python scripts/benchmark_scenarios.py --export-markdown reports/ci_benchmark.md
